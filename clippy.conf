limit_req_zone $binary_remote_addr zone=clippy:10m rate=5r/s;

upstream clippy_app {
    server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name www.clippy.test;
    return 301 http://clippy.test$request_uri;
}

server {
    listen 80;
    server_name clippy.test;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/clippy-errors;
        internal;
    }

    location / {
        limit_req zone=clippy burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://clippy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502;
    }
}
